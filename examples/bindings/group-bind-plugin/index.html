<?xml version="1.0" encoding="UTF-8"?>
<sc-plugin title="Group Bind Plugin" xmlns="http://www.w3.org/1999/xhtml" xmlns:bind="urn:sc-app:bind">
  <sc-group name="voices">
      <sc-control name="amp" value="0.15"/>
      <sc-control name="gate" value="1"/>
      <sc-synthdef name="tone">
          <sc-control name="freq" value="440"/>
          <sc-control name="amp" value="0.2"/>
          <sc-control name="gate" value="1"/>
          <sc-ugen name="osc" type="SinOsc">
              <sc-control name="freq" bind:value="freq"/>
          </sc-ugen>
          <sc-ugen name="env" type="Linen">
              <sc-control name="gate" bind:value="gate"/>
              <sc-control name="attacktime" value="0.01"/>
              <sc-control name="susLevel" value="1"/>
              <sc-control name="releasetime" value="0.1"/>
          </sc-ugen>
          <sc-ugen name="sig" type="BinaryOpUGen" op="*">
              <sc-control name="a" bind:value="osc"/>
              <sc-control name="b" bind:value="amp"/>
          </sc-ugen>
          <sc-ugen name="gated" type="BinaryOpUGen" op="*">
              <sc-control name="a" bind:value="sig"/>
              <sc-control name="b" bind:value="env"/>
          </sc-ugen>
          <sc-ugen name="out" type="Out">
              <sc-control name="bus" value="0"/>
              <sc-control name="channelsarray" bind:value="gated"/>
          </sc-ugen>
      </sc-synthdef>

      <sc-synth name="low" synthdef="tone">
          <sc-control name="freq" value="261"/>
          <sc-control name="amp" value="0.15"/>
          <sc-control name="gate" value="1"/>
      </sc-synth>
      <sc-synth name="high" synthdef="tone">
          <sc-control name="freq" value="523"/>
          <sc-control name="amp" value="0.15"/>
          <sc-control name="gate" value="1"/>
      </sc-synth>
      <sc-flex orientation="vertical" gap="md">
          <sc-flex orientation="vertical" gap="xs">
              <sc-flex align="center" gap="sm">
                  <sc-button bind:value="gate" bind:icon="gate ? 'stop' : 'play'"/>
                  <sc-text weight="bold">Group controls</sc-text>
              </sc-flex>
              <sc-text as="label">Shared amp</sc-text>
              <sc-slider bind:value="amp" min="0" max="1" step="0.01"/>
          </sc-flex>
          <sc-row gutter="md">
              <sc-col span="12">
                  <sc-flex orientation="vertical" gap="sm">
                      <sc-flex align="center" gap="sm">
                          <sc-button bind:value="low.gate" bind:icon="low.gate ? 'stop' : 'play'"/>
                          <sc-text weight="bold">Low voice</sc-text>
                      </sc-flex>
                      <sc-flex orientation="vertical" gap="xs" align="center">
                          <sc-knob bind:value="low.freq" min="20" max="1000" step="1"/>
                          <sc-text as="label">Freq <sc-display bind:value="low.freq" format="%d Hz"/></sc-text>
                      </sc-flex>
                      <sc-flex orientation="vertical" gap="xs" align="center">
                          <sc-knob bind:value="low.amp" min="0" max="1" step="0.01"/>
                          <sc-text as="label">Amp <sc-display bind:value="low.amp" format="%.2f"/></sc-text>
                      </sc-flex>
                  </sc-flex>
              </sc-col>
              <sc-col span="12">
                  <sc-flex orientation="vertical" gap="sm">
                      <sc-flex align="center" gap="sm">
                          <sc-button bind:value="high.gate" bind:icon="high.gate ? 'stop' : 'play'"/>
                          <sc-text weight="bold">High voice</sc-text>
                      </sc-flex>
                      <sc-flex orientation="vertical" gap="xs" align="center">
                          <sc-knob bind:value="high.freq" min="20" max="2000" step="1"/>
                          <sc-text as="label">Freq <sc-display bind:value="high.freq" format="%d Hz"/></sc-text>
                      </sc-flex>
                      <sc-flex orientation="vertical" gap="xs" align="center">
                          <sc-knob bind:value="high.amp" min="0" max="1" step="0.01"/>
                          <sc-text as="label">Amp <sc-display bind:value="high.amp" format="%.2f"/></sc-text>
                      </sc-flex>
                  </sc-flex>
              </sc-col>
          </sc-row>
      </sc-flex>
  </sc-group>
</sc-plugin>
