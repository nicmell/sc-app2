<?xml version="1.0" encoding="UTF-8"?>
<sc-plugin xmlns="http://www.w3.org/1999/xhtml" xmlns:bind="urn:sc-app:bind">
  <sc-synthdef name="frameSine">
      <sc-control name="freq" value="220"/>
      <sc-control name="amp" value="0.4"/>
      <sc-control name="gate" value="1"/>
      <sc-ugen name="osc" type="SinOsc">
          <sc-control name="freq" bind:value="freq"/>
      </sc-ugen>
      <sc-ugen name="scaled" type="BinaryOpUGen" op="*">
          <sc-control name="a" bind:value="osc"/>
          <sc-control name="b" bind:value="amp"/>
      </sc-ugen>
      <sc-ugen name="gated" type="BinaryOpUGen" op="*">
          <sc-control name="a" bind:value="scaled"/>
          <sc-control name="b" bind:value="gate"/>
      </sc-ugen>
      <sc-ugen name="out" type="Out">
          <sc-control name="bus" value="0"/>
          <sc-control name="channelsarray" bind:value="gated"/>
      </sc-ugen>
  </sc-synthdef>
  <sc-synth name="s1" synthdef="frameSine">
      <sc-control name="freq" value="220"/>
      <sc-control name="amp" value="0.4"/>
      <sc-control name="gate" value="1"/>
  </sc-synth>
  <sc-flex orientation="vertical" gap="sm" style="height:100%;">
      <sc-flex gap="md" align="center" wrap="true" style="flex:none;">
          <sc-flex orientation="vertical" gap="xs">
              <sc-text as="label">Freq <sc-display bind:value="s1.freq" format="%d Hz"/></sc-text>
              <sc-slider bind:value="s1.freq" min="20" max="2000" step="1"/>
          </sc-flex>
          <sc-flex orientation="vertical" gap="xs">
              <sc-text as="label">Amp <sc-display bind:value="s1.amp" format="%.2f"/></sc-text>
              <sc-slider bind:value="s1.amp" min="0" max="1" step="0.01"/>
          </sc-flex>
          <sc-flex align="center" gap="xs">
              <sc-checkbox bind:value="s1.gate"/>
              <sc-text as="label">Gate</sc-text>
          </sc-flex>
      </sc-flex>
      <sc-flex orientation="vertical" gap="xs" style="flex:1;min-height:0;">
          <sc-text tone="dim">1024 frames (~21 ms @ 48 kHz)</sc-text>
          <sc-scope bus="0" channels="1" frames="1024"/>
      </sc-flex>
      <sc-flex orientation="vertical" gap="xs" style="flex:1;min-height:0;">
          <sc-text tone="dim">2048 frames (~43 ms)</sc-text>
          <sc-scope bus="0" channels="1" frames="2048"/>
      </sc-flex>
      <sc-flex orientation="vertical" gap="xs" style="flex:1;min-height:0;">
          <sc-text tone="dim">4096 frames (~85 ms)</sc-text>
          <sc-scope bus="0" channels="1" frames="4096"/>
      </sc-flex>
      <sc-flex orientation="vertical" gap="xs" style="flex:1;min-height:0;">
          <sc-text tone="dim">8192 frames (~171 ms)</sc-text>
          <sc-scope bus="0" channels="1" frames="8192"/>
      </sc-flex>
  </sc-flex>
</sc-plugin>
