<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:bind="urn:sc-app:bind">
<head>
    <title>Example Plugin</title>
</head>
<body>
<sc-synthdef name="sine">
    <sc-control name="freq" value="440"/>
    <sc-control name="amp" value="0.2"/>
    <sc-control name="pan" value="0"/>
    <sc-control name="gate" value="1"/>
    <sc-ugen name="osc" type="SinOsc">
        <sc-control name="freq" bind:value="freq"/>
    </sc-ugen>
    <sc-ugen name="sig" type="BinaryOpUGen" op="*">
        <sc-control name="a" bind:value="osc"/>
        <sc-control name="b" bind:value="amp"/>
    </sc-ugen>
    <sc-ugen name="panned" type="Pan2">
        <sc-control name="in" bind:value="sig"/>
        <sc-control name="pos" bind:value="pan"/>
    </sc-ugen>
    <sc-ugen name="gated" type="BinaryOpUGen" op="*">
        <sc-control name="a" bind:value="panned"/>
        <sc-control name="b" bind:value="gate"/>
    </sc-ugen>
    <sc-ugen name="out" type="Out">
        <sc-control name="bus" value="0"/>
        <sc-control name="channelsarray" bind:value="gated"/>
    </sc-ugen>
</sc-synthdef>
<sc-synth name="s1" synthdef="sine">
    <sc-control name="freq" value="440"/>
    <sc-control name="amp" value="0.2"/>
    <sc-control name="pan" value="0"/>
    <sc-control name="gate" value="1"/>
</sc-synth>
<sc-button bind:value="s1.gate" bind:icon="s1.gate ? 'stop' : 'play'"/>
<div class="controls">
    <div class="knobs">
        <label>
            <sc-knob bind:value="s1.freq" min="20" max="2000" step="1"/>
            <span><sc-display bind:value="s1.freq" format="%d Hz"/></span>
        </label>
        <label>
            <sc-knob bind:value="s1.amp" min="0" max="1" step="0.01"/>
            <span><sc-display bind:value="s1.amp" format="%.2f"/></span>
        </label>
    </div>
    <div class="sliders">
        <label>
            <span>Pan: <sc-display bind:value="s1.pan" format="%.2f"/></span>
            <sc-slider bind:value="s1.pan" min="-1" max="1" step="0.01"/>
        </label>
        <label>
            <sc-checkbox bind:value="s1.gate" label="Gate"/>
        </label>
        <label>
            <sc-switch bind:value="s1.gate"/>
            <span>Gate (switch)</span>
        </label>
    </div>
</div>
</body>
</html>
