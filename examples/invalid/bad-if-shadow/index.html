<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>Bad If Shadow (intentional error)</title>
</head>
<body>
<!-- INTENTIONAL: sc-if contributes no path segment, so the inner "x" would
     share the outer "x"'s runtime store key — the per-parse claimed-key map
     must fail with "duplicate name in scope" (the cross-scope variant of the
     sibling-scope duplicate check) -->
<sc-var name="x" value="1"/>
<sc-if bind="x" is-truthy="">
    <sc-var name="x" value="2"/>
</sc-if>
</body>
</html>
