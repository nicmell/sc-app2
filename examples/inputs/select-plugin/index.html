<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:bind="urn:sc-app:bind">
<head>
    <title>Select Plugin</title>
</head>
<body>
<sc-synthdef name="tone">
    <sc-control name="freq" value="440"/>
    <sc-control name="amp" value="0.2"/>
    <sc-control name="gate" value="1"/>
    <sc-ugen name="osc" type="SinOsc">
        <sc-control name="freq" bind:value="freq"/>
    </sc-ugen>
    <sc-ugen name="vol" type="BinaryOpUGen" op="*">
        <sc-control name="a" bind:value="osc"/>
        <sc-control name="b" bind:value="amp"/>
    </sc-ugen>
    <sc-ugen name="gated" type="BinaryOpUGen" op="*">
        <sc-control name="a" bind:value="vol"/>
        <sc-control name="b" bind:value="gate"/>
    </sc-ugen>
    <sc-ugen name="out" type="Out">
        <sc-control name="bus" value="0"/>
        <sc-control name="channelsarray" bind:value="gated"/>
    </sc-ugen>
</sc-synthdef>
<sc-synth name="s1" synthdef="tone">
    <sc-control name="freq" value="440"/>
    <sc-control name="amp" value="0.2"/>
    <sc-control name="gate" value="1"/>
</sc-synth>
<sc-group name="vars">
    <sc-var name="mode" value="0"/>
</sc-group>
<sc-flex orientation="vertical" gap="md">
    <sc-flex align="center" gap="sm">
        <sc-button bind:value="s1.gate" bind:icon="s1.gate ? 'stop' : 'play'"/>
        <sc-text weight="bold">Tone selectors</sc-text>
    </sc-flex>
    <sc-row gutter="md">
        <sc-col span="12">
            <sc-flex orientation="vertical" gap="sm">
                <sc-text as="label">Frequency <sc-display bind:value="s1.freq" format="%d Hz"/></sc-text>
                <sc-select bind:value="s1.freq">
                    <sc-option value="261" label="C4 (261 Hz)"/>
                    <sc-option value="330" label="E4 (330 Hz)"/>
                    <sc-option value="392" label="G4 (392 Hz)"/>
                    <sc-option value="440" label="A4 (440 Hz)"/>
                    <sc-option value="523" label="C5 (523 Hz)"/>
                </sc-select>
                <sc-text as="label">Frequency buttons</sc-text>
                <sc-radio-group bind:value="s1.freq">
                    <sc-radio value="261" label="C4"/>
                    <sc-radio value="330" label="E4"/>
                    <sc-radio value="392" label="G4"/>
                    <sc-radio value="440" label="A4"/>
                    <sc-radio value="523" label="C5"/>
                </sc-radio-group>
            </sc-flex>
        </sc-col>
        <sc-col span="12">
            <sc-flex orientation="vertical" gap="sm">
                <sc-flex orientation="vertical" gap="xs" align="center">
                    <sc-knob bind:value="s1.amp" min="0" max="1" step="0.01"/>
                    <sc-text as="label">Amplitude <sc-display bind:value="s1.amp" format="%.2f"/></sc-text>
                </sc-flex>
                <sc-text as="label">Mode <sc-display bind:value="vars.mode" format="%d"/></sc-text>
                <sc-select bind:value="vars.mode">
                    <sc-option value="0" label="Off"/>
                    <sc-option value="1" label="On"/>
                    <sc-option value="2" label="Auto"/>
                </sc-select>
                <sc-radio-group bind:value="vars.mode">
                    <sc-radio value="0" label="Off"/>
                    <sc-radio value="1" label="On"/>
                    <sc-radio value="2" label="Auto"/>
                </sc-radio-group>
            </sc-flex>
        </sc-col>
    </sc-row>
</sc-flex>
</body>
</html>
