<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:bind="urn:sc-app:bind">
<head>
    <title>SynthDef Plugin</title>
</head>
<body>

<sc-synthdef name="fm-sine">
    <sc-control name="freq" value="440"/>
    <sc-control name="amp" value="0.2"/>
    <sc-control name="mod-freq" value="2"/>
    <sc-control name="mod-depth" value="200"/>
    <sc-control name="gate" value="1"/>
    <sc-ugen name="mod" type="SinOsc" rate="kr">
        <sc-control name="freq" bind:value="mod-freq"/>
    </sc-ugen>
    <sc-ugen name="mod-scaled" type="MulAdd" rate="kr">
        <sc-control name="in" bind:value="mod"/>
        <sc-control name="mul" bind:value="mod-depth"/>
        <sc-control name="add" bind:value="freq"/>
    </sc-ugen>
    <sc-ugen name="osc" type="SinOsc">
        <sc-control name="freq" bind:value="mod-scaled"/>
    </sc-ugen>
    <!-- An arithmetic bind:value lowers to BinaryOpUGen nodes automatically,
         replacing hand-built op-node markup: osc * amp * gate.
         (`mod-scaled` stays a MulAdd: mod-freq/mod-depth are hyphenated names,
         which the expression tokenizer can't address — use a plain ref/ugen.) -->
    <sc-ugen name="out" type="Out">
        <sc-control name="bus" value="0"/>
        <sc-control name="channelsarray" bind:value="osc * amp * gate"/>
    </sc-ugen>
</sc-synthdef>

<sc-synth name="fm" synthdef="fm-sine">
    <sc-control name="freq" value="440"/>
    <sc-control name="amp" value="0.2"/>
    <sc-control name="mod-freq" value="2"/>
    <sc-control name="mod-depth" value="200"/>
    <sc-control name="gate" value="1"/>
</sc-synth>
<sc-flex orientation="vertical" gap="md">
    <sc-flex align="center" gap="sm">
        <sc-button bind:value="fm.gate" bind:icon="fm.gate ? 'stop' : 'play'"/>
        <sc-text weight="bold">FM sine</sc-text>
        <sc-text tone="dim">Carrier and modulation controls</sc-text>
    </sc-flex>
    <sc-row gutter="md">
        <sc-col span="12">
            <sc-flex orientation="vertical" gap="sm">
                <sc-text weight="bold">Carrier</sc-text>
                <sc-flex align="center" gap="md" wrap="true">
                    <sc-flex orientation="vertical" gap="xs" align="center">
                        <sc-knob bind:value="fm.freq" min="20" max="2000" step="1"/>
                        <sc-text as="label">Freq <sc-display bind:value="fm.freq" format="%d Hz"/></sc-text>
                    </sc-flex>
                    <sc-flex orientation="vertical" gap="xs" align="center">
                        <sc-knob bind:value="fm.amp" min="0" max="1" step="0.01"/>
                        <sc-text as="label">Amp <sc-display bind:value="fm.amp" format="%.2f"/></sc-text>
                    </sc-flex>
                </sc-flex>
            </sc-flex>
        </sc-col>
        <sc-col span="12">
            <sc-flex orientation="vertical" gap="sm">
                <sc-text weight="bold">Modulator</sc-text>
                <sc-flex align="center" gap="md" wrap="true">
                    <sc-flex orientation="vertical" gap="xs" align="center">
                        <sc-knob bind:value="fm.mod-freq" min="0.1" max="20" step="0.1"/>
                        <sc-text as="label">Rate <sc-display bind:value="fm.mod-freq" format="%.1f Hz"/></sc-text>
                    </sc-flex>
                    <sc-flex orientation="vertical" gap="xs" align="center">
                        <sc-knob bind:value="fm.mod-depth" min="0" max="1000" step="1"/>
                        <sc-text as="label">Depth <sc-display bind:value="fm.mod-depth" format="%d"/></sc-text>
                    </sc-flex>
                </sc-flex>
            </sc-flex>
        </sc-col>
    </sc-row>
</sc-flex>
</body>
</html>
