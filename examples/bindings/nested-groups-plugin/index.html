<?xml version="1.0" encoding="UTF-8"?>
<sc-plugin title="Nested Groups Plugin" xmlns="http://www.w3.org/1999/xhtml" xmlns:bind="urn:sc-app:bind">
  <!-- Tests multi-segment resolve paths through nested groups -->
  <sc-synthdef name="tone">
      <sc-control name="freq" value="440"/>
      <sc-control name="amp" value="0.2"/>
      <sc-control name="gate" value="1"/>
      <sc-ugen name="osc" type="SinOsc">
          <sc-control name="freq" bind:value="freq"/>
      </sc-ugen>
      <sc-ugen name="sig" type="BinaryOpUGen" op="*">
          <sc-control name="a" bind:value="osc"/>
          <sc-control name="b" bind:value="amp"/>
      </sc-ugen>
      <sc-ugen name="gated" type="BinaryOpUGen" op="*">
          <sc-control name="a" bind:value="sig"/>
          <sc-control name="b" bind:value="gate"/>
      </sc-ugen>
      <sc-ugen name="out" type="Out">
          <sc-control name="bus" value="0"/>
          <sc-control name="channelsarray" bind:value="gated"/>
      </sc-ugen>
  </sc-synthdef>

  <sc-group name="outer">
      <sc-control name="amp" value="0.5"/>
      <sc-control name="gate" value="1"/>
      <sc-group name="inner">
          <sc-control name="amp" value="0.3"/>
          <sc-synth name="deep" synthdef="tone">
              <sc-control name="freq" value="330"/>
              <sc-control name="amp" value="0.2"/>
              <sc-control name="gate" value="1"/>
          </sc-synth>
      </sc-group>
      <sc-synth name="shallow" synthdef="tone">
          <sc-control name="freq" value="660"/>
          <sc-control name="amp" value="0.15"/>
          <sc-control name="gate" value="1"/>
      </sc-synth>
  </sc-group>

  <sc-flex orientation="vertical" gap="md">
      <sc-row gutter="md">
          <sc-col span="12">
              <sc-flex orientation="vertical" gap="sm">
                  <sc-flex align="center" gap="sm">
                      <sc-button bind:value="outer.inner.deep.gate" bind:icon="outer.inner.deep.gate ? 'stop' : 'play'"/>
                      <sc-text weight="bold">outer.inner.deep</sc-text>
                  </sc-flex>
                  <sc-flex orientation="vertical" gap="xs" align="center">
                      <sc-knob bind:value="outer.inner.deep.freq" min="20" max="1000" step="1"/>
                      <sc-text as="label">Freq <sc-display bind:value="outer.inner.deep.freq" format="%d Hz"/></sc-text>
                  </sc-flex>
                  <sc-flex orientation="vertical" gap="xs" align="center">
                      <sc-knob bind:value="outer.inner.deep.amp" min="0" max="1" step="0.01"/>
                      <sc-text as="label">Amp <sc-display bind:value="outer.inner.deep.amp" format="%.2f"/></sc-text>
                  </sc-flex>
              </sc-flex>
          </sc-col>
          <sc-col span="12">
              <sc-flex orientation="vertical" gap="sm">
                  <sc-flex align="center" gap="sm">
                      <sc-button bind:value="outer.shallow.gate" bind:icon="outer.shallow.gate ? 'stop' : 'play'"/>
                      <sc-text weight="bold">outer.shallow</sc-text>
                  </sc-flex>
                  <sc-flex orientation="vertical" gap="xs" align="center">
                      <sc-knob bind:value="outer.shallow.freq" min="20" max="2000" step="1"/>
                      <sc-text as="label">Freq <sc-display bind:value="outer.shallow.freq" format="%d Hz"/></sc-text>
                  </sc-flex>
              </sc-flex>
          </sc-col>
      </sc-row>
      <sc-flex orientation="vertical" gap="sm">
          <sc-flex align="center" gap="sm">
              <sc-button bind:value="outer.gate" bind:icon="outer.gate ? 'stop' : 'play'"/>
              <sc-text weight="bold">Group controls</sc-text>
          </sc-flex>
          <sc-text as="label">Outer amp <sc-display bind:value="outer.amp" format="%.2f"/></sc-text>
          <sc-slider bind:value="outer.amp" min="0" max="1" step="0.01"/>
          <sc-text as="label">Inner amp <sc-display bind:value="outer.inner.amp" format="%.2f"/></sc-text>
          <sc-slider bind:value="outer.inner.amp" min="0" max="1" step="0.01"/>
      </sc-flex>
  </sc-flex>
</sc-plugin>
