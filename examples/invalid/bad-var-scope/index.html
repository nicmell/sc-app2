<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>Bad Var Scope (intentional error)</title>
</head>
<body>
<!-- INTENTIONAL: a var declared inside sc-if (through a div — the XSD gates
     only sc-if's direct children; the runtime is the real gate). sc-if is
     path-transparent, so the inner "y" would live at the same store path as
     a root-level var — vars must be declared ON A NODE (plugin/group/synth);
     ScVar.resolveRuntime must fail with "must be declared on a node" -->
<sc-var name="x" value="1"/>
<sc-if bind="x">
    <div>
        <sc-var name="y" value="2"/>
    </div>
</sc-if>
</body>
</html>
