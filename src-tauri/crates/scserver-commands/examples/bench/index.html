<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>scserver-commands (WASM) vs osc-js — benchmark</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff; --fg: #1a1a1a; --muted: #6b7280;
        --line: #e5e7eb; --row: #f9fafb;
        --sc: #2563eb; --oj: #d97706; --ok: #16a34a; --bad: #dc2626;
        --card: #f3f4f6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e;
          --line: #21262d; --row: #161b22;
          --sc: #58a6ff; --oj: #f0a742; --ok: #3fb950; --bad: #f85149;
          --card: #161b22;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 2rem; background: var(--bg); color: var(--fg);
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
      p.sub { color: var(--muted); margin: 0 0 1.5rem; max-width: 60ch; }
      button {
        font: inherit; font-weight: 600; padding: .55rem 1.1rem; cursor: pointer;
        border: 1px solid var(--sc); background: var(--sc); color: #fff;
        border-radius: 8px;
      }
      button:disabled { opacity: .5; cursor: default; }
      .cards { display: flex; flex-wrap: wrap; gap: 1rem; margin: 1.5rem 0; }
      .card {
        background: var(--card); border: 1px solid var(--line); border-radius: 10px;
        padding: 1rem 1.25rem; min-width: 180px;
      }
      .card .k { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; }
      .card .v { font-size: 1.5rem; font-weight: 700; margin-top: .2rem; }
      h2 { font-size: 1.05rem; margin: 2rem 0 .5rem; }
      .note { color: var(--muted); font-size: .82rem; margin: 0 0 .75rem; max-width: 80ch; }
      .scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
      table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
      th, td { padding: .45rem .7rem; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
      th:first-child, td:first-child { text-align: left; font-family: ui-monospace, monospace; }
      thead th { position: sticky; top: 0; background: var(--bg); color: var(--muted); font-weight: 600; }
      tbody tr:nth-child(even) { background: var(--row); }
      .sc { color: var(--sc); font-weight: 600; }
      .oj { color: var(--oj); font-weight: 600; }
      .win-sc { color: var(--sc); font-weight: 700; }
      .win-oj { color: var(--oj); font-weight: 700; }
      .ok { color: var(--ok); } .bad { color: var(--bad); font-weight: 700; }
      #status { color: var(--muted); margin-left: 1rem; }
      .legend { display: flex; gap: 1.25rem; font-size: .82rem; color: var(--muted); margin: .75rem 0 0; }
      .swatch { display: inline-block; width: .7rem; height: .7rem; border-radius: 2px; vertical-align: middle; margin-right: .35rem; }
    </style>
  </head>
  <body>
    <h1>scserver-commands <span style="color:var(--muted)">(Rust → WASM)</span> vs <span style="color:var(--oj)">osc-js</span></h1>
    <p class="sub">
      OSC encode/decode throughput in the browser, over every SuperCollider
      server command and reply. Higher ops/sec is better.
    </p>
    <div>
      <button id="run">Run benchmark</button>
      <span id="status"></span>
    </div>
    <div class="legend">
      <span><span class="swatch" style="background:var(--sc)"></span>scserver-commands (WASM)</span>
      <span><span class="swatch" style="background:var(--oj)"></span>osc-js (pure JS)</span>
    </div>
    <div id="out"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
