<?xml version="1.0" encoding="UTF-8"?>
<sc-plugin title="Group Plugin" xmlns="http://www.w3.org/1999/xhtml" xmlns:bind="urn:sc-app:bind">
  <sc-group name="oscillators">
      <sc-control name="gate" value="1"/>
      <sc-synthdef name="sine">
          <sc-control name="freq" value="440"/>
          <sc-control name="amp" value="0.2"/>
          <sc-control name="pan" value="0"/>
          <sc-control name="gate" value="1"/>
          <sc-ugen name="osc" type="SinOsc">
              <sc-control name="freq" bind:value="freq"/>
          </sc-ugen>
          <sc-ugen name="sig" type="BinaryOpUGen" op="*">
              <sc-control name="a" bind:value="osc"/>
              <sc-control name="b" bind:value="amp"/>
          </sc-ugen>
          <sc-ugen name="panned" type="Pan2">
              <sc-control name="in" bind:value="sig"/>
              <sc-control name="pos" bind:value="pan"/>
          </sc-ugen>
          <sc-ugen name="gated" type="BinaryOpUGen" op="*">
              <sc-control name="a" bind:value="panned"/>
              <sc-control name="b" bind:value="gate"/>
          </sc-ugen>
          <sc-ugen name="out" type="Out">
              <sc-control name="bus" value="0"/>
              <sc-control name="channelsarray" bind:value="gated"/>
          </sc-ugen>
      </sc-synthdef>

      <sc-synth name="osc1" synthdef="sine">
          <sc-control name="freq" value="261"/>
          <sc-control name="amp" value="0.15"/>
          <sc-control name="pan" value="-0.5"/>
          <sc-control name="gate" value="1"/>
      </sc-synth>
      <sc-synth name="osc2" synthdef="sine">
          <sc-control name="freq" value="329"/>
          <sc-control name="amp" value="0.15"/>
          <sc-control name="pan" value="0.5"/>
          <sc-control name="gate" value="1"/>
      </sc-synth>

      <sc-flex orientation="vertical" gap="md">
          <sc-flex align="center" gap="sm">
              <sc-button bind:value="gate" bind:icon="gate ? 'stop' : 'play'"/>
              <sc-text weight="bold">Oscillator group</sc-text>
              <sc-text tone="dim">Shared gate for both voices</sc-text>
          </sc-flex>
          <sc-row gutter="md">
              <sc-col span="12">
                  <sc-flex orientation="vertical" gap="sm">
                      <sc-text weight="bold">Oscillator 1</sc-text>
                      <sc-flex align="center" gap="md" wrap="true">
                          <sc-flex orientation="vertical" gap="xs" align="center">
                              <sc-knob bind:value="osc1.freq" min="20" max="2000" step="1"/>
                              <sc-text as="label">Freq <sc-display bind:value="osc1.freq" format="%d Hz"/></sc-text>
                          </sc-flex>
                          <sc-flex orientation="vertical" gap="xs" align="center">
                              <sc-knob bind:value="osc1.amp" min="0" max="1" step="0.01"/>
                              <sc-text as="label">Amp <sc-display bind:value="osc1.amp" format="%.2f"/></sc-text>
                          </sc-flex>
                      </sc-flex>
                      <sc-text as="label">Pan <sc-display bind:value="osc1.pan" format="%.2f"/></sc-text>
                      <sc-slider bind:value="osc1.pan" min="-1" max="1" step="0.01"/>
                  </sc-flex>
              </sc-col>
              <sc-col span="12">
                  <sc-flex orientation="vertical" gap="sm">
                      <sc-text weight="bold">Oscillator 2</sc-text>
                      <sc-flex align="center" gap="md" wrap="true">
                          <sc-flex orientation="vertical" gap="xs" align="center">
                              <sc-knob bind:value="osc2.freq" min="20" max="2000" step="1"/>
                              <sc-text as="label">Freq <sc-display bind:value="osc2.freq" format="%d Hz"/></sc-text>
                          </sc-flex>
                          <sc-flex orientation="vertical" gap="xs" align="center">
                              <sc-knob bind:value="osc2.amp" min="0" max="1" step="0.01"/>
                              <sc-text as="label">Amp <sc-display bind:value="osc2.amp" format="%.2f"/></sc-text>
                          </sc-flex>
                      </sc-flex>
                      <sc-text as="label">Pan <sc-display bind:value="osc2.pan" format="%.2f"/></sc-text>
                      <sc-slider bind:value="osc2.pan" min="-1" max="1" step="0.01"/>
                  </sc-flex>
              </sc-col>
          </sc-row>
      </sc-flex>
  </sc-group>
</sc-plugin>
