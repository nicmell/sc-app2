[package]
name = "scserver-commands"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Typed Rust encoders and parsers for the SuperCollider server command protocol (OSC + NRT score)."
repository = "https://github.com/nicmell/scserver-commands"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
thiserror = "1"
rosc = "0.11"
# The wasm binding layer (src/wasm.rs): wasm-bindgen glue, tsify-derived
# TypeScript types (the serde tag IS the OSC address), serde-wasm-bindgen
# at the boundary. Native (rlib) consumers never pull these in.
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
tsify = { version = "0.5", default-features = false, features = ["js"], optional = true }

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:serde-wasm-bindgen", "dep:tsify"]

# NOTE: cargo ignores [profile.*] in non-root workspace members — release
# tuning for the wasm build comes from wasm-pack's defaults.
