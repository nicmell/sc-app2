<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>Var Plugin</title>
</head>
<body>
<sc-group name="vars">
    <sc-var name="knobValue" value="0.5"/>
    <sc-var name="sliderValue" value="0"/>
    <sc-var name="mirror" _value="vars.knobValue"/>
    <sc-var name="doubled" _value="vars.knobValue * 2"/>
    <sc-var name="sum" _value="vars.knobValue + vars.sliderValue"/>
    <sc-var name="product" _value="vars.knobValue * (vars.sliderValue + 1)"/>
</sc-group>
<div class="controls">
    <label>
        <sc-knob bind="vars.knobValue" min="0" max="1" step="0.01"/>
        <span>Knob: <sc-display _value="vars.knobValue" format="%.2f"/></span>
    </label>
    <label>
        <sc-slider bind="vars.sliderValue" min="-1" max="1" step="0.01"/>
        <span>Slider: <sc-display _value="vars.sliderValue" format="%.2f"/></span>
    </label>
    <label>
        <span>Mirror: <sc-display _value="vars.mirror" format="%.2f"/></span>
    </label>
    <label>
        <span>Doubled: <sc-display _value="vars.doubled" format="%.2f"/></span>
    </label>
    <label>
        <span>Sum (knob + slider): <sc-display _value="vars.sum" format="%.2f"/></span>
    </label>
    <label>
        <span>Product (knob * (slider + 1)): <sc-display _value="vars.product" format="%.2f"/></span>
    </label>
</div>
</body>
</html>
