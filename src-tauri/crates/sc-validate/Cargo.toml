[package]
name = "sc-validate"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# The browser build: `yarn generate:wasm` (wasm-pack --target web) compiles the
# same rules to the default pkg/ here for the frontend parse gate
# (src/lib/plugins/validate imports it via the @sc-validate alias). tsify
# generates the TypeScript definitions for the exported shapes (violations,
# parse errors) straight from the Rust types into the pkg d.ts — the ONE
# type source; its default `json` feature crosses the boundary via
# serde_json (plain objects, insertion-ordered keys).
wasm = ["dep:wasm-bindgen", "dep:tsify"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
wasm-bindgen = { version = "0.2", optional = true }
tsify = { version = "0.5.7", optional = true }

# The crate is tiny — skip wasm-opt so the committed artifact only depends on
# the pinned rustc + wasm-bindgen, not on a binaryen version.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
