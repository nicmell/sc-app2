<?xml version="1.0" encoding="UTF-8"?>
<sc-plugin xmlns="http://www.w3.org/1999/xhtml" xmlns:bind="urn:sc-app:bind">
  <sc-synthdef name="waveselect">
      <sc-control name="freq" value="440"/>
      <sc-control name="amp" value="0.2"/>
      <sc-control name="waveform" value="0"/>
      <sc-control name="gate" value="1"/>
      <sc-ugen name="sine" type="SinOsc">
          <sc-control name="freq" bind:value="freq"/>
      </sc-ugen>
      <sc-ugen name="saw" type="Saw">
          <sc-control name="freq" bind:value="freq"/>
      </sc-ugen>
      <sc-ugen name="square" type="Pulse">
          <sc-control name="freq" bind:value="freq"/>
          <sc-control name="width" value="0.5"/>
      </sc-ugen>
      <sc-ugen name="wave" type="Select">
          <sc-control name="which" bind:value="waveform"/>
          <sc-control name="channelsArray" bind:value="sine,saw,square"/>
      </sc-ugen>
      <sc-ugen name="vol" type="BinaryOpUGen" op="*">
          <sc-control name="a" bind:value="wave"/>
          <sc-control name="b" bind:value="amp"/>
      </sc-ugen>
      <sc-ugen name="gated" type="BinaryOpUGen" op="*">
          <sc-control name="a" bind:value="vol"/>
          <sc-control name="b" bind:value="gate"/>
      </sc-ugen>
      <sc-ugen name="out" type="Out">
          <sc-control name="bus" value="0"/>
          <sc-control name="channelsArray" bind:value="gated"/>
      </sc-ugen>
  </sc-synthdef>
  <sc-synth name="s1" synthdef="waveselect">
      <sc-control name="freq" value="440"/>
      <sc-control name="amp" value="0.2"/>
      <sc-control name="waveform" value="0"/>
      <sc-control name="gate" value="1"/>
  </sc-synth>
  <sc-flex orientation="vertical" gap="md">
      <sc-flex align="center" gap="sm">
          <sc-button bind:value="s1.gate" bind:icon="s1.gate ? 'stop' : 'play'"/>
          <sc-text weight="bold">Waveform select</sc-text>
      </sc-flex>
      <sc-row gutter="md" align="middle">
          <sc-col span="8">
              <sc-flex orientation="vertical" gap="xs">
                  <sc-text as="label">Waveform</sc-text>
                  <sc-select bind:value="s1.waveform">
                      <sc-option value="0" label="Sine"/>
                      <sc-option value="1" label="Saw"/>
                      <sc-option value="2" label="Square"/>
                  </sc-select>
              </sc-flex>
          </sc-col>
          <sc-col span="8">
              <sc-flex orientation="vertical" gap="xs" align="center">
                  <sc-knob bind:value="s1.freq" min="20" max="2000" step="1"/>
                  <sc-text as="label">Frequency <sc-display bind:value="s1.freq" format="%d Hz"/></sc-text>
              </sc-flex>
          </sc-col>
          <sc-col span="8">
              <sc-flex orientation="vertical" gap="xs" align="center">
                  <sc-knob bind:value="s1.amp" min="0" max="1" step="0.01"/>
                  <sc-text as="label">Amplitude <sc-display bind:value="s1.amp" format="%.2f"/></sc-text>
              </sc-flex>
          </sc-col>
      </sc-row>
  </sc-flex>
</sc-plugin>
