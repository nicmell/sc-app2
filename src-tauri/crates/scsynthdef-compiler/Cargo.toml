[package]
name = "scsynthdef-compiler"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "SuperCollider SynthDef (SCgf v2) compiler in pure Rust"
repository = "https://github.com/nicmell/scsynthdef-compiler"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# The wasm binding layer (src/wasm.rs + the generated src/builders_wasm.rs):
# wasm-bindgen glue, tsify-derived TypeScript types, serde-wasm-bindgen at
# the boundary. Native (rlib) consumers never pull these in.
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
tsify = { version = "0.5", default-features = false, features = ["js"], optional = true }

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:serde-wasm-bindgen", "dep:tsify"]
